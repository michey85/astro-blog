media:
  - name: public
    label: Публичные файлы
    input: public
    output: /
  - name: images
    label: Изображения записей
    input: src/assets/images
    output: "@assets/images"
    extensions: [png, jpg, jpeg, webp, avif, gif]
content:
  - name: posts
    label: Записи
    type: collection
    path: src/content/blog
    view:
      fields: [ title, draft, pubDatetime ]
    fields:
      - { name: author, label: Автор, type: string }
      - { name: pubDatetime, label: Дата публикации, type: date }
      - { name: modDatetime, label: Дата изменения, type: date }
      - { name: title, label: Заголовок, type: string, required: true }
      - { name: ogImage, label: OG-изображение, type: string }
      - { name: slug, label: Слаг, type: string }
      - { name: featured, label: Избранное, type: boolean }
      - { name: draft, label: Черновик, type: boolean }
      - { name: tags, label: Теги, type: string, list: true }
      - { name: featuredImage, label: Главное изображение, type: image, options: { media: images } }
      - { name: featuredImageAlt, label: Альтернативный текст главного изображения, type: string }
      - { name: description, label: Описание, type: string }
      - { name: body, label: Текст, type: rich-text }
  - name: pages
    label: Страницы
    type: collection
    path: src/content/pages
    filename: "{fields.slug}.md"
    view:
      fields: [ title, slug, showInMenu, draft ]
    fields:
      - { name: title, label: Заголовок, type: string, required: true }
      - { name: slug, label: "Слаг (URL: /slug/)", type: string, required: true, pattern: { regex: "^[a-z0-9]+(-[a-z0-9]+)*$", message: "Только строчные латинские буквы, цифры и дефисы" } }
      - { name: description, label: Описание, type: string }
      - { name: showInMenu, label: Показывать в меню, type: boolean }
      - { name: menuLabel, label: Подпись в меню (по умолчанию — заголовок), type: string }
      - { name: menuOrder, label: Порядок в меню (меньше значение — выше), type: number, default: 100 }
      - { name: draft, label: Черновик, type: boolean }
      - { name: body, label: Текст, type: rich-text, options: { input: public/assets, output: /assets } }
  - name: home
    label: Главная страница
    type: file
    path: src/data/home.md
    fields:
      - { name: title, label: Заголовок, type: string, required: true }
      - { name: body, label: Вступительный текст, type: rich-text, options: { input: public/assets, output: /assets } }
  - name: home-middle
    label: "Главная: текст после избранных записей"
    type: file
    path: src/data/home-middle.md
    fields:
      - { name: body, label: "Текст (оставьте пустым, чтобы скрыть)", type: rich-text, options: { input: public/assets, output: /assets } }
  - name: home-bottom
    label: "Главная: текст после всех записей"
    type: file
    path: src/data/home-bottom.md
    fields:
      - { name: body, label: "Текст (оставьте пустым, чтобы скрыть)", type: rich-text, options: { input: public/assets, output: /assets } }
  - name: settings
    label: Настройки сайта
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - { name: title, label: "Название сайта (шапка, вкладка браузера, RSS)", type: string, required: true }
      - name: socials
        label: Ссылки на соцсети (показываются в этом порядке)
        type: object
        list: true
        fields:
          - name: name
            label: Сеть
            type: select
            required: true
            options:
              values: [Github, Facebook, Instagram, LinkedIn, Mail, Twitter, Twitch, YouTube, WhatsApp, Snapchat, Pinterest, TikTok, CodePen, Discord, GitLab, Reddit, Skype, Steam, Telegram, Mastodon]
          - { name: href, label: "URL (для Mail используйте mailto:you@example.com)", type: string, required: true }
          - { name: active, label: Показывать на сайте, type: boolean, default: true }
      - name: analytics
        label: Метрика и счётчики (работают только на опубликованном сайте)
        type: object
        fields:
          - { name: yandexMetrikaId, label: "Номер счётчика Яндекс Метрики (только цифры, например 12345678)", type: string, pattern: { regex: "^\\d*$", message: "Только цифры" } }
          - { name: yandexWebvisor, label: Включить Вебвизор (запись действий посетителей), type: boolean, default: false }
          - { name: googleAnalyticsId, label: "Идентификатор Google Analytics 4 (G-XXXXXXX)", type: string, pattern: { regex: "^(G-[A-Z0-9]+)?$", message: "Формат: G-XXXXXXX" } }
          - { name: headCode, label: "Произвольный код в <head> (другие счётчики, пиксели, верификация; виджеты не поддерживаются)", type: code, options: { format: html } }
          - { name: bodyCode, label: "Произвольный код в конец <body> (noscript-части счётчиков; виджеты вроде чатов и баннеров исчезнут при переходе между страницами)", type: code, options: { format: html } }
