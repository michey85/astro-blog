media:
  - name: public
    label: Public files
    input: public
    output: /
  - name: images
    label: Post images
    input: src/assets/images
    output: "@assets/images"
    extensions: [png, jpg, jpeg, webp, avif, gif]
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    view:
      fields: [ title, draft, pubDatetime ]
    fields:
      - { name: author, label: Author, type: string }
      - { name: pubDatetime, label: Published date, type: date }
      - { name: modDatetime, label: Modified date, type: date }
      - { name: title, label: Title, type: string, required: true }
      - { name: ogImage, label: OG image, type: string }
      - { name: slug, label: Slug, type: string }
      - { name: featured, label: Featured, type: boolean }
      - { name: draft, label: Draft, type: boolean }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: featuredImage, label: Featured image, type: image, options: { media: images } }
      - { name: featuredImageAlt, label: Featured image alt text, type: string }
      - { name: description, label: Description, type: string }
      - { name: body, label: Body, type: rich-text }
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    filename: "{fields.slug}.md"
    view:
      fields: [ title, slug, showInMenu, draft ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: "Slug (URL: /slug/)", type: string, required: true, pattern: { regex: "^[a-z0-9]+(-[a-z0-9]+)*$", message: "Lowercase latin letters, digits and dashes only" } }
      - { name: description, label: Description, type: string }
      - { name: showInMenu, label: Show in menu, type: boolean }
      - { name: menuLabel, label: Menu label (defaults to title), type: string }
      - { name: menuOrder, label: Menu order (lower comes first), type: number, default: 100 }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Body, type: rich-text, options: { input: public/assets, output: /assets } }
