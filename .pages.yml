media:
  - name: public
    label: Public files
    input: public
    output: /
  - name: images
    label: Post images
    input: src/assets/images
    output: "@assets/images"
    extensions: [png, jpg, jpeg, webp, avif, gif]
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    view:
      fields: [ title, draft, pubDatetime ]
    fields:
      - { name: author, label: Author, type: string }
      - { name: pubDatetime, label: Published date, type: date }
      - { name: modDatetime, label: Modified date, type: date }
      - { name: title, label: Title, type: string, required: true }
      - { name: ogImage, label: OG image, type: string }
      - { name: slug, label: Slug, type: string }
      - { name: featured, label: Featured, type: boolean }
      - { name: draft, label: Draft, type: boolean }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: featuredImage, label: Featured image, type: image, options: { media: images } }
      - { name: featuredImageAlt, label: Featured image alt text, type: string }
      - { name: description, label: Description, type: string }
      - { name: body, label: Body, type: rich-text }
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    filename: "{fields.slug}.md"
    view:
      fields: [ title, slug, showInMenu, draft ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: "Slug (URL: /slug/)", type: string, required: true, pattern: { regex: "^[a-z0-9]+(-[a-z0-9]+)*$", message: "Lowercase latin letters, digits and dashes only" } }
      - { name: description, label: Description, type: string }
      - { name: showInMenu, label: Show in menu, type: boolean }
      - { name: menuLabel, label: Menu label (defaults to title), type: string }
      - { name: menuOrder, label: Menu order (lower comes first), type: number, default: 100 }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Body, type: rich-text, options: { input: public/assets, output: /assets } }
  - name: home
    label: Home page
    type: file
    path: src/data/home.md
    fields:
      - { name: title, label: Heading, type: string, required: true }
      - { name: body, label: Intro text, type: rich-text, options: { input: public/assets, output: /assets } }
  - name: home-middle
    label: "Home page: text after featured posts"
    type: file
    path: src/data/home-middle.md
    fields:
      - { name: body, label: Text (leave empty to hide), type: rich-text, options: { input: public/assets, output: /assets } }
  - name: home-bottom
    label: "Home page: text after all posts"
    type: file
    path: src/data/home-bottom.md
    fields:
      - { name: body, label: Text (leave empty to hide), type: rich-text, options: { input: public/assets, output: /assets } }
  - name: settings
    label: Site settings
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - { name: title, label: "Site title (header, browser tab, RSS)", type: string, required: true }
      - name: socials
        label: Social links (shown in this order)
        type: object
        list: true
        fields:
          - name: name
            label: Network
            type: select
            required: true
            options:
              values: [Github, Facebook, Instagram, LinkedIn, Mail, Twitter, Twitch, YouTube, WhatsApp, Snapchat, Pinterest, TikTok, CodePen, Discord, GitLab, Reddit, Skype, Steam, Telegram, Mastodon]
          - { name: href, label: "URL (use mailto:you@example.com for Mail)", type: string, required: true }
          - { name: active, label: Show on site, type: boolean, default: true }
